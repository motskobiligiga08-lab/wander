<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="description" content="Wander – Your all-in-one travel companion. Plan trips, pack smart, track budget, journal memories, and discover destinations." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wander" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Wander – Travel Companion</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <!-- Splash / Loading -->
    <div id="splash" class="splash">
      <div class="splash-content">
        <div class="logo-mark">✈</div>
        <h1>Wander</h1>
        <p>Your travel companion</p>
      </div>
    </div>

    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <button id="menu-btn" class="icon-btn" aria-label="Menu">☰</button>
        <h1 class="app-title">Wander</h1>
      </div>
      <div class="header-right">
        <button id="theme-btn" class="icon-btn" aria-label="Toggle theme">🌙</button>
        <button id="install-btn" class="btn-install hidden">Install App</button>
      </div>
    </header>

    <!-- Sidebar Navigation -->
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <span class="logo-mark small">✈</span>
        <strong>Wander</strong>
      </div>
      <ul class="nav-list">
        <li><button class="nav-item active" data-view="dashboard">🏠 Dashboard</button></li>
        <li><button class="nav-item" data-view="trips">🗓 Trips & Itinerary</button></li>
        <li><button class="nav-item" data-view="packing">🧳 Packing Lists</button></li>
        <li><button class="nav-item" data-view="budget">💰 Budget</button></li>
        <li><button class="nav-item" data-view="journal">📔 Journal</button></li>
        <li><button class="nav-item" data-view="destinations">🌍 Destinations</button></li>
        <li><button class="nav-item" data-view="settings">⚙️ Settings</button></li>
      </ul>
      <div class="sidebar-footer">
        <p class="version">v1.0 · Offline ready</p>
      </div>
    </nav>
    <div id="overlay" class="overlay"></div>

    <!-- Main Content -->
    <main id="main" class="main-content">
      <!-- Views injected by JS -->
    </main>

    <!-- Bottom Nav (mobile) -->
    <nav class="bottom-nav">
      <button class="bottom-item active" data-view="dashboard" aria-label="Dashboard">
        <span>🏠</span><small>Home</small>
      </button>
      <button class="bottom-item" data-view="trips" aria-label="Trips">
        <span>🗓</span><small>Trips</small>
      </button>
      <button class="bottom-item" data-view="packing" aria-label="Packing">
        <span>🧳</span><small>Pack</small>
      </button>
      <button class="bottom-item" data-view="budget" aria-label="Budget">
        <span>💰</span><small>Budget</small>
      </button>
      <button class="bottom-item" data-view="journal" aria-label="Journal">
        <span>📔</span><small>Journal</small>
      </button>
    </nav>

    <!-- Modal -->
    <div id="modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modal-title">Title</h2>
          <button id="modal-close" class="icon-btn">✕</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
        <div id="modal-footer" class="modal-footer"></div>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registered', reg.scope))
          .catch(err => console.log('SW failed', err));
      });
    }
  </script>
</body>
</html>
